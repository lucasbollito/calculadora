<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rune Systems - Calculadora</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;600;700;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-obsidian: #070D12;
      --bg-surface: #0E141B;
      --rune-cyan: #00E5B8;
      --rune-cyan-glow: rgba(0, 229, 184, 0.5);
      --border-subtle: rgba(0, 229, 184, 0.2);
      --drakkar-teal: #164654;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-obsidian);
      font-family: 'Space Grotesk', -apple-system, sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
    }

    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Halo / Holofote de Luz Dinâmico que segue o mouse no fundo */
    #mouse-glow {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
      background: radial-gradient(750px circle at 50% 50%, rgba(0, 229, 184, 0.15), rgba(22, 70, 84, 0.05) 45%, transparent 75%);
      transition: background 0.05s linear;
    }

    /* Vagalumes, Pontos de Luz & Telemetria Canvas */
    #rune-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
    }

    /* Grid de Ruído Rúnico Sutil */
    .rune-noise-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 2;
      background-image: radial-gradient(rgba(0, 229, 184, 0.04) 1px, transparent 0);
      background-size: 28px 28px;
    }

    /* Card Principal com Glassmorphism Translúcido */
    .rune-glass-card {
      background: rgba(10, 16, 23, 0.74);
      border: 1px solid rgba(0, 229, 184, 0.28);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.85), 
                  0 0 45px rgba(0, 229, 184, 0.14),
                  inset 0 1px 0 rgba(0, 229, 184, 0.35);
    }

    /* Botões Rúnicos */
    .btn-rune {
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      user-select: none;
      -webkit-user-select: none;
      position: relative;
      overflow: hidden;
    }

    .btn-rune:active {
      transform: scale(0.94);
    }

    .btn-rune-num {
      background: rgba(22, 70, 84, 0.28);
      color: #F1F5F9;
      border: 1px solid rgba(0, 229, 184, 0.18);
      backdrop-filter: blur(8px);
    }

    .btn-rune-num:hover {
      background: rgba(0, 229, 184, 0.18);
      border-color: rgba(0, 229, 184, 0.55);
      box-shadow: 0 0 18px rgba(0, 229, 184, 0.28);
      color: #FFFFFF;
      transform: translateY(-1px);
    }

    .btn-rune-op {
      background: rgba(0, 229, 184, 0.14);
      color: #00E5B8;
      border: 1px solid rgba(0, 229, 184, 0.38);
      font-weight: 700;
    }

    .btn-rune-op:hover {
      background: rgba(0, 229, 184, 0.28);
      border-color: #00E5B8;
      box-shadow: 0 0 22px rgba(0, 229, 184, 0.45);
      color: #FFFFFF;
      transform: translateY(-1px);
    }

    .btn-rune-ac {
      background: rgba(244, 63, 94, 0.16);
      color: #FB7185;
      border: 1px solid rgba(244, 63, 94, 0.35);
      font-weight: 700;
    }

    .btn-rune-ac:hover {
      background: rgba(244, 63, 94, 0.3);
      border-color: #F43F5E;
      box-shadow: 0 0 22px rgba(244, 63, 94, 0.45);
      color: #FFFFFF;
      transform: translateY(-1px);
    }

    .btn-rune-equal {
      background: linear-gradient(135deg, #00E5B8, #00B4A0);
      color: #070D12;
      font-weight: 900;
      box-shadow: 0 4px 24px rgba(0, 229, 184, 0.5);
      border: 1px solid #52FFD5;
    }

    .btn-rune-equal:hover {
      background: linear-gradient(135deg, #38EFC6, #00D4B2);
      box-shadow: 0 6px 34px rgba(0, 229, 184, 0.75);
      transform: translateY(-2px);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 antialiased selection:bg-[#00E5B8] selection:text-[#070D12] relative">

  <!-- Halo de Luz Dinâmico que segue o Mouse no Fundo -->
  <div id="mouse-glow"></div>

  <!-- Canvas dos Vagalumes Mágicos, Telemetria & Pontos de Luz -->
  <canvas id="rune-canvas"></canvas>

  <!-- Overlay de Ruído Sutil -->
  <div class="rune-noise-overlay"></div>

  <!-- Container Principal da Calculadora -->
  <main class="w-full max-w-sm rune-glass-card rounded-3xl p-6 flex flex-col gap-4 relative z-10">
    
    <!-- Logo Oficial Rune Systems Destacado no Topo -->
    <header class="flex flex-col items-center justify-center border-b border-[rgba(0,229,184,0.18)] pb-3.5">
      <div class="relative py-1 flex items-center justify-center">
        <img src="assets/logo-rune-transparent.png" 
             onerror="this.src='assets/logo-full.svg'" 
             alt="Rune Systems" 
             class="h-14 w-auto object-contain filter drop-shadow-[0_0_18px_rgba(0,229,184,0.6)] transition-all duration-300 hover:scale-105" />
      </div>

      <div class="w-full flex items-center justify-between mt-2 pt-2 border-t border-[rgba(0,229,184,0.1)]">
        <div class="flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-[#00E5B8] animate-ping"></span>
          <span class="text-[10px] font-mono tracking-widest text-[#00E5B8] uppercase font-bold">CALCULATOR v2.0</span>
        </div>

        <!-- Botão de Histórico -->
        <button id="toggleHistory" title="Ver Histórico de Cálculos" class="text-xs text-slate-300 hover:text-[#00E5B8] transition-colors flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-[rgba(22,70,84,0.35)] hover:bg-[rgba(0,229,184,0.2)] border border-[rgba(0,229,184,0.25)]">
          <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span>Hist&oacute;rico</span>
        </button>
      </div>
    </header>

    <!-- Display Obsidian Neon -->
    <section class="bg-[#05080c] border border-[rgba(0,229,184,0.28)] rounded-2xl p-4 flex flex-col justify-end items-end min-h-[96px] overflow-hidden shadow-inner relative">
      <div class="absolute top-2 left-3 flex items-center gap-1.5">
        <span class="w-1.5 h-1.5 rounded-full bg-[#00E5B8]"></span>
        <span class="text-[9px] uppercase tracking-widest text-[rgba(0,229,184,0.7)] font-mono">TELEMETRY ACTIVE</span>
      </div>
      <div id="subDisplay" class="text-xs text-slate-400 font-mono min-h-[18px] truncate max-w-full"></div>
      <div id="mainDisplay" class="text-3xl font-bold tracking-tight font-mono text-[#00E5B8] truncate max-w-full drop-shadow-[0_0_12px_rgba(0,229,184,0.6)]">0</div>
    </section>

    <!-- Histórico de Cálculos (painel retrátil) -->
    <section id="historyPanel" class="hidden bg-[#05080c]/95 border border-[rgba(0,229,184,0.3)] rounded-2xl p-3 max-h-48 overflow-y-auto text-xs font-mono flex flex-col gap-1.5 shadow-2xl">
      <div class="flex justify-between items-center text-slate-400 text-[11px] pb-1.5 border-b border-slate-800">
        <span class="text-[#00E5B8] font-bold">&Uacute;ltimos C&aacute;lculos</span>
        <button id="clearHistory" class="text-rose-400 hover:text-rose-300 hover:underline">Limpar</button>
      </div>
      <div id="historyList" class="flex flex-col gap-1 text-slate-200">
        <span class="text-slate-500 italic text-center py-2">Nenhum c&aacute;lculo recente</span>
      </div>
    </section>

    <!-- Teclado de Botões com Estilo Rune -->
    <div class="grid grid-cols-4 gap-2 text-base font-medium">
      <!-- Linha 1 -->
      <button class="btn-rune btn-rune-ac py-3 rounded-xl" data-action="clear">AC</button>
      <button class="btn-rune btn-rune-num py-3 rounded-xl flex items-center justify-center" data-action="backspace" title="Apagar">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/></svg>
      </button>
      <button class="btn-rune btn-rune-op py-3 rounded-xl" data-action="sqrt">&radic;</button>
      <button class="btn-rune btn-rune-op py-3 rounded-xl text-lg" data-action="op" data-val="/">&divide;</button>

      <!-- Linha 2 -->
      <button class="btn-rune btn-rune-num py-3 rounded-xl" data-val="7">7</button>
      <button class="btn-rune btn-rune-num py-3 rounded-xl" data-val="8">8</button>
      <button class="btn-rune btn-rune-num py-3 rounded-xl" data-val="9">9</button>
      <button class="btn-rune btn-rune-op py-3 rounded-xl text-lg" data-action="op" data-val="*">&times;</button>

      <!-- Linha 3 -->
      <button class="btn-rune btn-rune-num py-3 rounded-xl" data-val="4">4</button>
      <button class="btn-rune btn-rune-num py-3 rounded-xl" data-val="5">5</button>
      <button class="btn-rune btn-rune-num py-3 rounded-xl" data-val="6">6</button>
      <button class="btn-rune btn-rune-op py-3 rounded-xl text-lg" data-action="op" data-val="-">&minus;</button>

      <!-- Linha 4 -->
      <button class="btn-rune btn-rune-num py-3 rounded-xl" data-val="1">1</button>
      <button class="btn-rune btn-rune-num py-3 rounded-xl" data-val="2">2</button>
      <button class="btn-rune btn-rune-num py-3 rounded-xl" data-val="3">3</button>
      <button class="btn-rune btn-rune-op py-3 rounded-xl text-lg" data-action="op" data-val="+">+</button>

      <!-- Linha 5 -->
      <button class="btn-rune btn-rune-num py-3 rounded-xl font-semibold" data-action="plusminus">&plusmn;</button>
      <button class="btn-rune btn-rune-num py-3 rounded-xl" data-val="0">0</button>
      <button class="btn-rune btn-rune-num py-3 rounded-xl" data-val=".">,</button>
      <button class="btn-rune btn-rune-equal py-3 rounded-xl text-lg" data-action="equals">=</button>
    </div>

    <!-- Rodapé de Telemetria e Teclado -->
    <footer class="text-[11px] text-slate-400 text-center flex items-center justify-center gap-1.5 pt-1 border-t border-[rgba(0,229,184,0.12)]">
      <span class="text-slate-500">Atalhos:</span>
      <kbd class="px-1.5 py-0.5 rounded bg-[#05080c] border border-[rgba(0,229,184,0.3)] text-[#00E5B8] font-mono text-[10px]">0-9</kbd>
      <kbd class="px-1.5 py-0.5 rounded bg-[#05080c] border border-[rgba(0,229,184,0.3)] text-[#00E5B8] font-mono text-[10px]">Enter</kbd>
      <kbd class="px-1.5 py-0.5 rounded bg-[#05080c] border border-[rgba(0,229,184,0.3)] text-[#00E5B8] font-mono text-[10px]">Esc</kbd>
    </footer>
  </main>

  <!-- Script Oficial de Pontos de Luz, Vagalumes Mágicos & Magnetismo do Cursor -->
  <script>
    /* ==============================================================
     * RUNE SYSTEMS - Interactive Fireflies & Mouse Light Points Canvas
     * Efeito oficial idêntico aos sistemas Rune Calls, Disparador e Chatwoot
     * ============================================================== */
    (function () {
      'use strict';

      function initRuneParticles() {
        var canvas = document.getElementById('rune-canvas');
        var mouseGlow = document.getElementById('mouse-glow');
        if (!canvas) return;

        var ctx = canvas.getContext('2d');
        if (!ctx) return;

        var width = (canvas.width = window.innerWidth);
        var height = (canvas.height = window.innerHeight);

        window.addEventListener('resize', function () {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        });

        // 1. Variáveis de Estado declaradas no topo do escopo
        var mouse = {
          x: window.innerWidth / 2,
          y: window.innerHeight / 2,
          radius: 200,
          active: false
        };
        var mouseTimeout;
        var particles = [];
        var sparkles = [];

        // 2. Eventos de Movimento do Mouse
        window.addEventListener('mousemove', function (e) {
          mouse.x = e.clientX;
          mouse.y = e.clientY;
          mouse.active = true;

          // Atualiza holofote suave no fundo
          if (mouseGlow) {
            mouseGlow.style.background = 'radial-gradient(750px circle at ' + e.clientX + 'px ' + e.clientY + 'px, rgba(0, 229, 184, 0.16), rgba(22, 70, 84, 0.06) 45%, transparent 75%)';
          }

          clearTimeout(mouseTimeout);
          mouseTimeout = setTimeout(function () {
            mouse.active = false;
          }, 3500);

          // Gera pontos de luz e centelhas vivas no rastro imediato do cursor
          var sparkCount = Math.floor(Math.random() * 2) + 2;
          for (var s = 0; s < sparkCount; s++) {
            sparkles.push({
              x: e.clientX + (Math.random() - 0.5) * 16,
              y: e.clientY + (Math.random() - 0.5) * 16,
              vx: (Math.random() - 0.5) * 2.0,
              vy: (Math.random() - 0.5) * 2.0 - 0.5,
              radius: Math.random() * 2.6 + 1.2,
              alpha: 1.0,
              decay: 0.018 + Math.random() * 0.022
            });
          }
        });

        window.addEventListener('mouseleave', function () {
          mouse.active = false;
        });

        // 3. Paleta e Símbolos Rúnicos
        var colors = [
          'rgba(0, 229, 184, ',   // Ciano Rúnico (#00E5B8)
          'rgba(22, 190, 180, ',  // Drakkar Cyan
          'rgba(148, 240, 225, ', // Brilho Mágico Claro
          'rgba(255, 255, 255, '  // Centelha Rúnica Pura
        ];

        var runes = ['\u16B1', '\u16A2', '\u16BE', '\u16D6', '\u16DF', '\u16CF', '\u16D2', '\u16A8', '\u2726'];

        function Particle() {
          this.reset();
        }

        Particle.prototype.reset = function () {
          this.x = Math.random() * width;
          this.y = Math.random() * height;
          this.baseRadius = Math.random() * 2.2 + 1.1;
          this.radius = this.baseRadius;
          this.colorPrefix = colors[Math.floor(Math.random() * colors.length)];
          this.vx = (Math.random() - 0.5) * 0.7;
          this.vy = (Math.random() - 0.5) * 0.7 - 0.15;
          this.pulse = Math.random() * Math.PI * 2;
          this.pulseSpeed = 0.02 + Math.random() * 0.035;
          this.isRune = Math.random() < 0.22;
          this.runeChar = runes[Math.floor(Math.random() * runes.length)];
          this.alpha = 0.25 + Math.random() * 0.65;
          this.friction = 0.93;
        };

        Particle.prototype.update = function () {
          this.pulse += this.pulseSpeed;
          var pulseFactor = 0.5 + Math.sin(this.pulse) * 0.45;
          this.currentAlpha = Math.max(0.12, Math.min(1, this.alpha * pulseFactor));

          // Gravidade magnética: pontos de luz são atraídos e "colam" no mouse
          if (mouse.active && mouse.x !== null && mouse.y !== null) {
            var dx = mouse.x - this.x;
            var dy = mouse.y - this.y;
            var dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < mouse.radius && dist > 2) {
              var force = (mouse.radius - dist) / mouse.radius;
              // Puxa suavemente para colar e orbitar ao redor do cursor
              this.vx += (dx / dist) * force * 0.75;
              this.vy += (dy / dist) * force * 0.75;
              this.vx *= this.friction;
              this.vy *= this.friction;

              this.currentAlpha = Math.min(1, this.currentAlpha + 0.45);
              this.radius = this.baseRadius * 1.5;
            } else {
              this.radius = this.baseRadius;
            }
          } else {
            this.radius = this.baseRadius;
          }

          // Limite de velocidade para movimento suave e orgânico
          var speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
          var maxSpeed = 3.2;
          if (speed > maxSpeed) {
            this.vx = (this.vx / speed) * maxSpeed;
            this.vy = (this.vy / speed) * maxSpeed;
          }

          this.x += this.vx;
          this.y += this.vy;

          // Movimento natural suave
          this.vx += (Math.random() - 0.5) * 0.04;
          this.vy += (Math.random() - 0.5) * 0.04;

          // Reposicionar nas bordas da tela
          if (this.x < -40) this.x = width + 40;
          if (this.x > width + 40) this.x = -40;
          if (this.y < -40) this.y = height + 40;
          if (this.y > height + 40) this.y = -40;
        };

        Particle.prototype.draw = function () {
          if (this.isRune) {
            ctx.save();
            ctx.font = Math.floor(this.radius * 6 + 11) + 'px "Space Grotesk", sans-serif';
            ctx.fillStyle = this.colorPrefix + this.currentAlpha + ')';
            ctx.shadowColor = '#00E5B8';
            ctx.shadowBlur = 12;
            ctx.fillText(this.runeChar, this.x, this.y);
            ctx.restore();
          } else {
            ctx.save();
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = this.colorPrefix + this.currentAlpha + ')';
            ctx.shadowColor = '#00E5B8';
            ctx.shadowBlur = 12;
            ctx.fill();
            ctx.restore();
          }
        };

        // 4. Popula a constelação de vagalumes
        var particleCount = Math.min(85, Math.floor((width * height) / 14000));
        for (var i = 0; i < particleCount; i++) {
          particles.push(new Particle());
        }

        // 5. Loop de Renderização a 60 FPS
        function animate() {
          ctx.clearRect(0, 0, width, height);

          // 5.1. Holofote dinâmico na ponta do mouse renderizado diretamente no Canvas
          if (mouse.active && mouse.x !== null && mouse.y !== null) {
            var glowGrad = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 250);
            glowGrad.addColorStop(0, 'rgba(0, 229, 184, 0.20)');
            glowGrad.addColorStop(0.35, 'rgba(22, 190, 180, 0.07)');
            glowGrad.addColorStop(0.7, 'rgba(7, 13, 18, 0.02)');
            glowGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = glowGrad;
            ctx.beginPath();
            ctx.arc(mouse.x, mouse.y, 250, 0, Math.PI * 2);
            ctx.fill();
          }

          // 5.2. Linhas de telemetria entre vagalumes próximos
          var maxDist = 115;
          for (var i = 0; i < particles.length; i++) {
            for (var j = i + 1; j < particles.length; j++) {
              var dx = particles[i].x - particles[j].x;
              var dy = particles[i].y - particles[j].y;
              var dist = Math.sqrt(dx * dx + dy * dy);

              if (dist < maxDist) {
                var lineAlpha = (1 - dist / maxDist) * 0.20;
                ctx.beginPath();
                ctx.moveTo(particles[i].x, particles[i].y);
                ctx.lineTo(particles[j].x, particles[j].y);
                ctx.strokeStyle = 'rgba(0, 229, 184, ' + lineAlpha + ')';
                ctx.lineWidth = 0.85;
                ctx.stroke();
              }
            }
          }

          // 5.3. FEIXES DE ENERGIA CONECTANDO OS VAGALUMES DIRETAMENTE AO MOUSE
          if (mouse.active && mouse.x !== null && mouse.y !== null) {
            for (var k = 0; k < particles.length; k++) {
              var pK = particles[k];
              var mdx = mouse.x - pK.x;
              var mdy = mouse.y - pK.y;
              var mdist = Math.sqrt(mdx * mdx + mdy * mdy);

              if (mdist < mouse.radius && mdist > 2) {
                var beamAlpha = (1 - mdist / mouse.radius) * 0.65;
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(pK.x, pK.y);
                ctx.lineTo(mouse.x, mouse.y);
                ctx.strokeStyle = 'rgba(0, 229, 184, ' + beamAlpha + ')';
                ctx.lineWidth = 1.3;
                ctx.shadowColor = '#00E5B8';
                ctx.shadowBlur = 8;
                ctx.stroke();
                ctx.restore();
              }
            }
          }

          // 5.4. Atualiza e desenha cada vagalume / runa
          for (var p = 0; p < particles.length; p++) {
            particles[p].update();
            particles[p].draw();
          }

          // 5.5. Faíscas e pontos de luz vivos brotando e seguindo o rastro do cursor
          for (var s = sparkles.length - 1; s >= 0; s--) {
            var sp = sparkles[s];
            sp.x += sp.vx;
            sp.y += sp.vy;
            sp.alpha -= sp.decay;

            if (sp.alpha <= 0) {
              sparkles.splice(s, 1);
              continue;
            }

            ctx.save();
            ctx.beginPath();
            ctx.arc(sp.x, sp.y, sp.radius * sp.alpha, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0, 229, 184, ' + sp.alpha + ')';
            ctx.shadowColor = '#00E5B8';
            ctx.shadowBlur = 14;
            ctx.fill();
            ctx.restore();
          }

          requestAnimationFrame(animate);
        }

        animate();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initRuneParticles);
      } else {
        initRuneParticles();
      }
    })();

    /* ==============================================================
     * CALCULATOR LOGIC ENGINE
     * ============================================================== */
    (function initCalculator() {
      var currentVal = "0";
      var prevVal = null;
      var operator = null;
      var shouldResetDisplay = false;
      var history = [];

      var mainDisplay = document.getElementById("mainDisplay");
      var subDisplay = document.getElementById("subDisplay");
      var historyPanel = document.getElementById("historyPanel");
      var historyList = document.getElementById("historyList");
      var toggleHistoryBtn = document.getElementById("toggleHistory");
      var clearHistoryBtn = document.getElementById("clearHistory");

      function formatNumber(numStr) {
        if (!numStr || numStr === "Erro") return numStr;
        var parts = numStr.split(".");
        var intPart = parts[0];
        var decPart = parts.length > 1 ? "," + parts[1] : "";
        intPart = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        return intPart + decPart;
      }

      function getOpSymbol(op) {
        switch (op) {
          case "/": return "&divide;";
          case "*": return "&times;";
          case "-": return "&minus;";
          case "+": return "+";
          default: return "";
        }
      }

      function updateDisplay() {
        mainDisplay.innerHTML = formatNumber(currentVal);
        if (operator !== null && prevVal !== null) {
          subDisplay.innerHTML = formatNumber(prevVal) + " " + getOpSymbol(operator);
        } else {
          subDisplay.innerHTML = "";
        }
      }

      function inputDigit(digit) {
        if (currentVal === "Erro") {
          currentVal = digit;
          shouldResetDisplay = false;
          updateDisplay();
          return;
        }

        if (shouldResetDisplay) {
          currentVal = digit;
          shouldResetDisplay = false;
        } else {
          if (currentVal === "0") {
            currentVal = digit;
          } else {
            if (currentVal.replace(/[^0-9]/g, "").length >= 14) return;
            currentVal += digit;
          }
        }
        updateDisplay();
      }

      function inputDecimal() {
        if (currentVal === "Erro") {
          currentVal = "0.";
          shouldResetDisplay = false;
          updateDisplay();
          return;
        }

        if (shouldResetDisplay) {
          currentVal = "0.";
          shouldResetDisplay = false;
        } else if (!currentVal.includes(".")) {
          currentVal += ".";
        }
        updateDisplay();
      }

      function handleOperator(nextOp) {
        if (currentVal === "Erro") return;

        if (operator !== null && !shouldResetDisplay) {
          handleEquals();
        }

        prevVal = currentVal;
        shouldResetDisplay = true;
        operator = nextOp;
        updateDisplay();
      }

      function calculate(first, second, op) {
        switch (op) {
          case "+": return first + second;
          case "-": return first - second;
          case "*": return first * second;
          case "/": return second === 0 ? "Erro" : first / second;
          default: return second;
        }
      }

      function handleEquals() {
        if (operator === null || prevVal === null || currentVal === "Erro") return;

        var first = parseFloat(prevVal);
        var second = parseFloat(currentVal);
        var op = operator;
        var result = calculate(first, second, op);

        if (result === "Erro") {
          currentVal = "Erro";
        } else {
          var cleanResult = parseFloat(result.toFixed(10));
          addHistory(formatNumber(String(first)) + " " + getOpSymbol(op) + " " + formatNumber(String(second)) + " = " + formatNumber(String(cleanResult)));
          currentVal = String(cleanResult);
        }

        prevVal = null;
        operator = null;
        shouldResetDisplay = true;
        updateDisplay();
      }

      function handleClear() {
        currentVal = "0";
        prevVal = null;
        operator = null;
        shouldResetDisplay = false;
        updateDisplay();
      }

      function handleBackspace() {
        if (shouldResetDisplay || currentVal === "Erro") {
          currentVal = "0";
        } else {
          currentVal = currentVal.length > 1 ? currentVal.slice(0, -1) : "0";
        }
        updateDisplay();
      }

      function handleSqrt() {
        if (currentVal === "Erro") return;
        var val = parseFloat(currentVal);
        if (val < 0) {
          currentVal = "Erro";
        } else {
          var res = parseFloat(Math.sqrt(val).toFixed(10));
          addHistory("&radic;(" + formatNumber(String(val)) + ") = " + formatNumber(String(res)));
          currentVal = String(res);
          shouldResetDisplay = true;
        }
        updateDisplay();
      }

      function handlePlusMinus() {
        if (currentVal === "0" || currentVal === "Erro") return;
        currentVal = currentVal.startsWith("-") ? currentVal.slice(1) : "-" + currentVal;
        updateDisplay();
      }

      function addHistory(entry) {
        history.unshift(entry);
        if (history.length > 15) history.pop();
        renderHistory();
      }

      function renderHistory() {
        if (history.length === 0) {
          historyList.innerHTML = '<span class="text-slate-500 italic text-center py-2">Nenhum c&aacute;lculo recente</span>';
          return;
        }
        historyList.innerHTML = history
          .map(function(item) {
            var parts = item.split(" = ");
            var resultVal = parts[1] || "";
            return '<div class="p-1.5 rounded hover:bg-[rgba(0,229,184,0.15)] cursor-pointer truncate transition-colors text-slate-300 hover:text-white" onclick="window.__loadHistory(\'' + resultVal + '\')">' + item + '</div>';
          })
          .join("");
      }

      window.__loadHistory = function(val) {
        if (!val) return;
        currentVal = val.replace(/\./g, "").replace(",", ".");
        shouldResetDisplay = false;
        updateDisplay();
      };

      // Button clicks
      document.querySelectorAll(".btn-rune").forEach(function(btn) {
        btn.addEventListener("click", function() {
          var val = btn.getAttribute("data-val");
          var action = btn.getAttribute("data-action");

          if (val) {
            if (val === ".") inputDecimal();
            else if (action === "op") handleOperator(val);
            else inputDigit(val);
          } else if (action) {
            switch (action) {
              case "clear": handleClear(); break;
              case "backspace": handleBackspace(); break;
              case "equals": handleEquals(); break;
              case "sqrt": handleSqrt(); break;
              case "plusminus": handlePlusMinus(); break;
            }
          }
        });
      });

      // Keyboard support
      window.addEventListener("keydown", function(e) {
        if (e.key >= "0" && e.key <= "9") inputDigit(e.key);
        else if (e.key === "." || e.key === ",") inputDecimal();
        else if (e.key === "+" || e.key === "-" || e.key === "*" || e.key === "/") handleOperator(e.key);
        else if (e.key === "Enter" || e.key === "=") { e.preventDefault(); handleEquals(); }
        else if (e.key === "Backspace") handleBackspace();
        else if (e.key === "Escape") handleClear();
      });

      // History Toggle & Clear
      toggleHistoryBtn.addEventListener("click", function() {
        historyPanel.classList.toggle("hidden");
      });
      clearHistoryBtn.addEventListener("click", function() {
        history.length = 0;
        renderHistory();
      });

      updateDisplay();
    })();
  </script>
</body>
</html>
