<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Interativa</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .btn-calc {
      transition: all 0.12s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
      -webkit-user-select: none;
    }
    .btn-calc:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 antialiased selection:bg-emerald-500 selection:text-white font-sans">

  <div class="w-full max-w-sm bg-slate-900/90 border border-slate-800 rounded-3xl p-5 shadow-2xl backdrop-blur-md flex flex-col gap-4">
    
    <!-- Top Bar: Title & History Toggle -->
    <div class="flex items-center justify-between px-1">
      <div class="flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
        <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Calculadora</span>
      </div>
      <button id="toggleHistory" title="Ver Histórico" class="text-xs text-slate-400 hover:text-slate-100 transition-colors flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-slate-800/60 hover:bg-slate-800">
        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span>Hist&oacute;rico</span>
      </button>
    </div>

    <!-- Display Screen -->
    <div class="bg-slate-950/80 border border-slate-800/80 rounded-2xl p-4 flex flex-col justify-end items-end min-h-[92px] overflow-hidden">
      <div id="subDisplay" class="text-xs text-slate-500 font-mono min-h-[18px] truncate max-w-full"></div>
      <div id="mainDisplay" class="text-3xl font-bold tracking-tight font-mono text-emerald-400 truncate max-w-full">0</div>
    </div>

    <!-- History Overlay (collapsible) -->
    <div id="historyPanel" class="hidden bg-slate-950/90 border border-slate-800 rounded-2xl p-3 max-h-44 overflow-y-auto text-xs font-mono flex flex-col gap-1.5">
      <div class="flex justify-between items-center text-slate-400 text-[11px] pb-1.5 border-b border-slate-800">
        <span>&Uacute;ltimas Contas</span>
        <button id="clearHistory" class="text-rose-400 hover:underline">Limpar</button>
      </div>
      <div id="historyList" class="flex flex-col gap-1 text-slate-200">
        <span class="text-slate-500 italic text-center py-2">Nenhum c&aacute;lculo recente</span>
      </div>
    </div>

    <!-- Keypad Grid -->
    <div class="grid grid-cols-4 gap-2 text-base font-medium">
      <!-- Row 1 -->
      <button class="btn-calc bg-rose-500/20 text-rose-400 hover:bg-rose-500/30 py-3 rounded-xl font-semibold border border-rose-500/20" data-action="clear">AC</button>
      <button class="btn-calc bg-slate-800/80 text-slate-200 hover:bg-slate-700 py-3 rounded-xl border border-slate-700/40 flex items-center justify-center" data-action="backspace" title="Apagar">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/></svg>
      </button>
      <button class="btn-calc bg-slate-800/80 text-slate-200 hover:bg-slate-700 py-3 rounded-xl border border-slate-700/40 text-lg font-semibold" data-action="sqrt">&radic;</button>
      <button class="btn-calc bg-emerald-600/90 text-white hover:bg-emerald-500 py-3 rounded-xl font-bold border border-emerald-500/30 text-lg" data-action="op" data-val="/">&divide;</button>

      <!-- Row 2 -->
      <button class="btn-calc bg-slate-800/60 text-slate-100 hover:bg-slate-700/80 py-3 rounded-xl border border-slate-700/30" data-val="7">7</button>
      <button class="btn-calc bg-slate-800/60 text-slate-100 hover:bg-slate-700/80 py-3 rounded-xl border border-slate-700/30" data-val="8">8</button>
      <button class="btn-calc bg-slate-800/60 text-slate-100 hover:bg-slate-700/80 py-3 rounded-xl border border-slate-700/30" data-val="9">9</button>
      <button class="btn-calc bg-emerald-600/90 text-white hover:bg-emerald-500 py-3 rounded-xl font-bold border border-emerald-500/30 text-lg" data-action="op" data-val="*">&times;</button>

      <!-- Row 3 -->
      <button class="btn-calc bg-slate-800/60 text-slate-100 hover:bg-slate-700/80 py-3 rounded-xl border border-slate-700/30" data-val="4">4</button>
      <button class="btn-calc bg-slate-800/60 text-slate-100 hover:bg-slate-700/80 py-3 rounded-xl border border-slate-700/30" data-val="5">5</button>
      <button class="btn-calc bg-slate-800/60 text-slate-100 hover:bg-slate-700/80 py-3 rounded-xl border border-slate-700/30" data-val="6">6</button>
      <button class="btn-calc bg-emerald-600/90 text-white hover:bg-emerald-500 py-3 rounded-xl font-bold border border-emerald-500/30 text-lg" data-action="op" data-val="-">&minus;</button>

      <!-- Row 4 -->
      <button class="btn-calc bg-slate-800/60 text-slate-100 hover:bg-slate-700/80 py-3 rounded-xl border border-slate-700/30" data-val="1">1</button>
      <button class="btn-calc bg-slate-800/60 text-slate-100 hover:bg-slate-700/80 py-3 rounded-xl border border-slate-700/30" data-val="2">2</button>
      <button class="btn-calc bg-slate-800/60 text-slate-100 hover:bg-slate-700/80 py-3 rounded-xl border border-slate-700/30" data-val="3">3</button>
      <button class="btn-calc bg-emerald-600/90 text-white hover:bg-emerald-500 py-3 rounded-xl font-bold border border-emerald-500/30 text-lg" data-action="op" data-val="+">+</button>

      <!-- Row 5 -->
      <button class="btn-calc bg-slate-800/80 text-slate-200 hover:bg-slate-700 py-3 rounded-xl border border-slate-700/40 text-lg font-semibold" data-action="plusminus">&plusmn;</button>
      <button class="btn-calc bg-slate-800/60 text-slate-100 hover:bg-slate-700/80 py-3 rounded-xl border border-slate-700/30" data-val="0">0</button>
      <button class="btn-calc bg-slate-800/60 text-slate-100 hover:bg-slate-700/80 py-3 rounded-xl border border-slate-700/30" data-val=".">,</button>
      <button class="btn-calc bg-gradient-to-r from-emerald-500 to-teal-500 text-slate-950 font-bold hover:brightness-110 py-3 rounded-xl shadow-lg shadow-emerald-500/20 text-lg" data-action="equals">=</button>
    </div>

    <!-- Quick keyboard hint -->
    <div class="text-[11px] text-slate-500 text-center flex items-center justify-center gap-1">
      <span>Teclado:</span>
      <kbd class="px-1.5 py-0.5 rounded bg-slate-800 border border-slate-700 text-slate-400">0-9</kbd>
      <kbd class="px-1.5 py-0.5 rounded bg-slate-800 border border-slate-700 text-slate-400">Enter</kbd>
      <kbd class="px-1.5 py-0.5 rounded bg-slate-800 border border-slate-700 text-slate-400">Esc</kbd>
    </div>
  </div>

  <script>
    (function () {
      let currentVal = "0";
      let prevVal = null;
      let operator = null;
      let shouldResetDisplay = false;
      const history = [];

      const mainDisplay = document.getElementById("mainDisplay");
      const subDisplay = document.getElementById("subDisplay");
      const historyPanel = document.getElementById("historyPanel");
      const historyList = document.getElementById("historyList");
      const toggleHistoryBtn = document.getElementById("toggleHistory");
      const clearHistoryBtn = document.getElementById("clearHistory");

      function formatNumber(numStr) {
        if (!numStr || numStr === "Erro") return numStr;
        const parts = numStr.split(".");
        const intPart = parts[0];
        const decPart = parts[1];
        const formattedInt = Number(intPart).toLocaleString("pt-BR");
        return decPart !== undefined ? formattedInt + "," + decPart : formattedInt;
      }

      function getOpSymbol(op) {
        if (op === "*") return "\u00D7";
        if (op === "/") return "\u00F7";
        if (op === "-") return "\u2212";
        return "+";
      }

      function updateDisplay() {
        mainDisplay.textContent = formatNumber(currentVal);
        if (operator && prevVal !== null) {
          subDisplay.textContent = formatNumber(prevVal) + " " + getOpSymbol(operator);
        } else {
          subDisplay.textContent = "";
        }
      }

      function inputDigit(digit) {
        if (currentVal === "Erro") {
          currentVal = digit;
          shouldResetDisplay = false;
        } else if (shouldResetDisplay) {
          currentVal = digit;
          shouldResetDisplay = false;
        } else {
          currentVal = currentVal === "0" ? digit : currentVal + digit;
        }
        updateDisplay();
      }

      function inputDecimal() {
        if (shouldResetDisplay || currentVal === "Erro") {
          currentVal = "0.";
          shouldResetDisplay = false;
        } else if (!currentVal.includes(".")) {
          currentVal += ".";
        }
        updateDisplay();
      }

      function handleOperator(nextOp) {
        if (currentVal === "Erro") return;
        const inputValue = parseFloat(currentVal);

        if (operator && shouldResetDisplay) {
          operator = nextOp;
          updateDisplay();
          return;
        }

        if (prevVal === null) {
          prevVal = String(inputValue);
        } else if (operator) {
          const result = calculate(parseFloat(prevVal), inputValue, operator);
          if (result === "Erro") {
            currentVal = "Erro";
            prevVal = null;
            operator = null;
            updateDisplay();
            return;
          }
          currentVal = String(result);
          prevVal = String(result);
        }

        shouldResetDisplay = true;
        operator = nextOp;
        updateDisplay();
      }

      function calculate(first, second, op) {
        switch (op) {
          case "+": return first + second;
          case "-": return first - second;
          case "*": return first * second;
          case "/": return second === 0 ? "Erro" : first / second;
          default: return second;
        }
      }

      function handleEquals() {
        if (operator === null || prevVal === null || currentVal === "Erro") return;

        const first = parseFloat(prevVal);
        const second = parseFloat(currentVal);
        const op = operator;
        const result = calculate(first, second, op);

        if (result === "Erro") {
          currentVal = "Erro";
        } else {
          const cleanResult = parseFloat(result.toFixed(10));
          addHistory(formatNumber(String(first)) + " " + getOpSymbol(op) + " " + formatNumber(String(second)) + " = " + formatNumber(String(cleanResult)));
          currentVal = String(cleanResult);
        }

        prevVal = null;
        operator = null;
        shouldResetDisplay = true;
        updateDisplay();
      }

      function handleClear() {
        currentVal = "0";
        prevVal = null;
        operator = null;
        shouldResetDisplay = false;
        updateDisplay();
      }

      function handleBackspace() {
        if (shouldResetDisplay || currentVal === "Erro") {
          currentVal = "0";
        } else {
          currentVal = currentVal.length > 1 ? currentVal.slice(0, -1) : "0";
        }
        updateDisplay();
      }

      function handleSqrt() {
        if (currentVal === "Erro") return;
        const val = parseFloat(currentVal);
        if (val < 0) {
          currentVal = "Erro";
        } else {
          const res = parseFloat(Math.sqrt(val).toFixed(10));
          addHistory("\u221A(" + formatNumber(String(val)) + ") = " + formatNumber(String(res)));
          currentVal = String(res);
          shouldResetDisplay = true;
        }
        updateDisplay();
      }

      function handlePlusMinus() {
        if (currentVal === "0" || currentVal === "Erro") return;
        currentVal = currentVal.startsWith("-") ? currentVal.slice(1) : "-" + currentVal;
        updateDisplay();
      }

      function addHistory(entry) {
        history.unshift(entry);
        if (history.length > 15) history.pop();
        renderHistory();
      }

      function renderHistory() {
        if (history.length === 0) {
          historyList.innerHTML = '<span class="text-slate-500 italic text-center py-2">Nenhum c&aacute;lculo recente</span>';
          return;
        }
        historyList.innerHTML = history
          .map(function(item) {
            var parts = item.split(" = ");
            var resultVal = parts[1] || "";
            return '<div class="p-1.5 rounded hover:bg-slate-800 cursor-pointer truncate transition-colors" onclick="window.__loadHistory('' + resultVal + '')">' + item + '</div>';
          })
          .join("");
      }

      window.__loadHistory = function(val) {
        if (!val) return;
        currentVal = val.replace(/\./g, "").replace(",", ".");
        shouldResetDisplay = false;
        updateDisplay();
      };

      // Button clicks
      document.querySelectorAll(".btn-calc").forEach(function(btn) {
        btn.addEventListener("click", function() {
          var val = btn.getAttribute("data-val");
          var action = btn.getAttribute("data-action");

          if (val) {
            if (val === ".") inputDecimal();
            else if (action === "op") handleOperator(val);
            else inputDigit(val);
          } else if (action) {
            switch (action) {
              case "clear": handleClear(); break;
              case "backspace": handleBackspace(); break;
              case "equals": handleEquals(); break;
              case "sqrt": handleSqrt(); break;
              case "plusminus": handlePlusMinus(); break;
            }
          }
        });
      });

      // Keyboard support
      window.addEventListener("keydown", function(e) {
        if (e.key >= "0" && e.key <= "9") inputDigit(e.key);
        else if (e.key === "." || e.key === ",") inputDecimal();
        else if (e.key === "+" || e.key === "-" || e.key === "*" || e.key === "/") handleOperator(e.key);
        else if (e.key === "Enter" || e.key === "=") { e.preventDefault(); handleEquals(); }
        else if (e.key === "Backspace") handleBackspace();
        else if (e.key === "Escape") handleClear();
      });

      // History Toggle & Clear
      toggleHistoryBtn.addEventListener("click", function() {
        historyPanel.classList.toggle("hidden");
      });
      clearHistoryBtn.addEventListener("click", function() {
        history.length = 0;
        renderHistory();
      });

      updateDisplay();
    })();
  </script>
</body>
</html>
