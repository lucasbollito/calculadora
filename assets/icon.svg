  <!-- Right Code Tag /> -->
  <path d="M 86 52 L 91 38" stroke="url(#runeCyan)" stroke-width="5" stroke-linecap="round" />
  <path d="M 94 40 L 104 48 L 94 56" stroke="url(#runeCyan)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
