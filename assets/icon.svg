<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="runeCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5C8" />
      <stop offset="100%" stop-color="#00D4B2" />
    </linearGradient>
    <linearGradient id="drakkarTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24788C" />
      <stop offset="100%" stop-color="#0E414E" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Code Bracket < -->
  <path d="M 24 48 L 12 58 L 24 68" stroke="url(#runeCyan)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

