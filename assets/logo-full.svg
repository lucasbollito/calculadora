<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 120" fill="none">
  <defs>
    <linearGradient id="runeCyanFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5C8" />
      <stop offset="100%" stop-color="#00D4B2" />
    </linearGradient>
    <linearGradient id="drakkarTealFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24788C" />
      <stop offset="100%" stop-color="#0E414E" />
    </linearGradient>
  </defs>

  <!-- ICON MONOGRAM -->
  <g transform="translate(10, 0)">
    <!-- Left Bracket < -->
    <path d="M 22 48 L 10 58 L 22 68" stroke="url(#runeCyanFull)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Drakkar Boat Base -->
    <path d="M 10 76 C 10 90 24 96 38 96 L 74 96 C 88 96 100 90 100 76 C 96 84 86 88 72 88 L 36 88 C 22 88 14 84 10 76 Z" fill="url(#drakkarTealFull)" />
    <!-- Drakkar Prows -->
    <path d="M 10 76 C 8 70 6 68 9 64 C 11 67 13 72 15 76 Z" fill="url(#drakkarTealFull)" />
    <path d="M 100 76 C 103 70 101 66 98 62 C 96 67 95 72 94 76 Z" fill="url(#drakkarTealFull)" />

    <!-- Runic Stem of R -->
    <path d="M 33 24 L 33 90" stroke="url(#runeCyanFull)" stroke-width="8" stroke-linecap="round" />

    <!-- Runic Upper Loop -->
    <path d="M 33 24 L 66 40 L 33 56" stroke="url(#runeCyanFull)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Runic Leg -->
    <path d="M 44 51 L 80 88" stroke="url(#runeCyanFull)" stroke-width="8" stroke-linecap="round" />

    <!-- Right Tag /> -->
    <path d="M 84 52 L 89 38" stroke="url(#runeCyanFull)" stroke-width="5" stroke-linecap="round" />
    <path d="M 92 40 L 102 48 L 92 56" stroke="url(#runeCyanFull)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- TEXT RUNE SYSTEMS -->
  <!-- RUNE -->
  <text x="145" y="65" font-family="'Space Grotesk', 'Montserrat', 'Inter', -apple-system, sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" letter-spacing="4">RUNE</text>
  
  <!-- SYSTEMS -->
  <text x="147" y="93" font-family="'Space Grotesk', 'Montserrat', 'Inter', -apple-system, sans-serif" font-size="22" font-weight="700" fill="#E2E8F0" letter-spacing="8.5">SYSTEMS</text>
</svg>